name: Kali Linux Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Tailscale on Host
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="kali-github-rdp"
          sleep 5
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

      - name: 2. Run Kali Linux Docker Container
        run: |
          docker run -d --name kali-rdp \
            --privileged \
            --network bridge \
            -p 3389:3389 \
            kalilinux/kali-rolling \
            bash -c "tail -f /dev/null"

      - name: 3. Install Desktop & XRDP with Debug
        run: |
          docker exec kali-rdp bash -c '
            export DEBIAN_FRONTEND=noninteractive
            
            # نصب پکیج‌های ضروری
            apt-get update
            apt-get install -y kali-desktop-xfce xrdp sudo dbus-x11 x11-xserver-utils net-tools
            
            # ساخت کاربر admin
            useradd -m -s /bin/bash admin
            echo "admin:admin" | chpasswd
            usermod -aG sudo admin
            
            # تنظیم startwm.sh
            cat > /etc/xrdp/startwm.sh << "EOF"
            #!/bin/sh
            unset DBUS_SESSION_BUS_ADDRESS
            unset XDG_RUNTIME_DIR
            exec startxfce4
            EOF
            chmod +x /etc/xrdp/startwm.sh
            
            # تنظیم .xsession
            echo "startxfce4" > /home/admin/.xsession
            chown admin:admin /home/admin/.xsession
            chmod +x /home/admin/.xsession
            
            # تنظیم xrdp.ini برای bind به همه اینترفیس‌ها
            sed -i "s/^port=3389/port=3389/" /etc/xrdp/xrdp.ini
            sed -i "s/^use_vsock=false/use_vsock=false/" /etc/xrdp/xrdp.ini
            
            # غیرفعال کردن فایروال
            apt-get remove -y ufw || true
            
            # شروع XRDP مستقیماً (نه با service)
            /usr/sbin/xrdp-sesman &
            sleep 2
            /usr/sbin/xrdp &
            sleep 3
            
            # بررسی وضعیت
            echo "=== XRDP Process Check ==="
            ps aux | grep xrdp
            echo "=== Port Check ==="
            netstat -tlnp | grep 3389 || ss -tlnp | grep 3389
          '

      - name: 4. Verify Connection
        run: |
          # بررسی پورت در هاست
          echo "=== Checking Port 3389 on Host ==="
          sudo netstat -tlnp | grep 3389 || ss -tlnp | grep 3389
          
          echo ""
          echo "=================================================="
          echo "  >>> KALI LINUX RDP SERVER IS READY! <<<"
          echo "  Tailscale IP : ${{ env.TAILSCALE_IP }}"
          echo "  Username     : admin"
          echo "  Password     : admin"
          echo "  >> Connect with Remote Desktop to: ${{ env.TAILSCALE_IP }}"
          echo "=================================================="

      - name: 5. Keep Server Alive
        run: |
          for i in {1..360}; do
            echo "[$i/360] Kali server is running..."
            sleep 60
          done
