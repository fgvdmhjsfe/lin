name: Kali Linux Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup Everything
        env:
          DEBIAN_FRONTEND: noninteractive
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # نصب همه پکیج‌ها
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11 \
            net-tools nmap wireshark john hydra sqlmap nikto aircrack-ng \
            curl wget git python3-pip

          # ساخت کاربر
          sudo useradd -m -s /bin/bash admin
          echo "admin:admin" | sudo chpasswd
          sudo usermod -aG sudo admin

          # تنظیم دسکتاپ
          echo "xfce4-session" | sudo tee /home/admin/.xsession
          sudo chown admin:admin /home/admin/.xsession
          sudo chmod +x /home/admin/.xsession

          sudo bash -c 'cat > /etc/xrdp/startwm.sh << EOF
#!/bin/sh
unset DBUS_SESSION_BUS_ADDRESS
unset XDG_RUNTIME_DIR
exec startxfce4
EOF'
          sudo chmod +x /etc/xrdp/startwm.sh

          # XRDP setup
          sudo adduser xrdp ssl-cert 2>/dev/null || true
          sudo bash -c 'cd /etc/xrdp && xrdp-keygen xrdp rsakeys.ini'
          sudo chown xrdp:xrdp /etc/xrdp/rsakeys.ini

          # فایروال
          sudo iptables -F 2>/dev/null || true
          sudo iptables -P INPUT ACCEPT 2>/dev/null || true

          # نصب Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

          # Start Tailscale
          sudo mkdir -p /var/run/tailscale
          sudo tailscaled --tun=userspace-networking --state=mem: &
          sleep 5
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="kali-rdp"
          sleep 3
          TS_IP=$(sudo tailscale ip -4 | head -n1)

          # Start XRDP
          sudo /usr/sbin/xrdp-sesman &
          sleep 2
          sudo /usr/sbin/xrdp &
          sleep 3

          # نمایش اطلاعات
          echo ""
          echo "=========================================="
          echo "IP: $TS_IP"
          echo "User: admin"
          echo "Pass: admin"
          echo "=========================================="

          # Keep Alive
          for i in {1..360}; do
            pgrep xrdp > /dev/null || sudo /usr/sbin/xrdp &
            echo "[$i/360] Running"
            sleep 60
          done
