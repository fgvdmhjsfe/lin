name: Kali Linux Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Tailscale on Host
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # نصب Tailscale روی هاست اوبونتو (نه داخل کانتینر)
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # اتصال به شبکه Tailscale
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="kali-github-rdp"
          
          sleep 5
          
          # دریافت IP تایل‌اسکیل
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          
          echo ""
          echo "=================================================="
          echo "  Tailscale Connected!"
          echo "  Tailscale IP : $TS_IP"
          echo "=================================================="

      - name: 2. Run Kali Linux Docker Container
        run: |
          # اجرای کانتینر کالی با port mapping
          docker run -d --name kali-rdp \
            --privileged \
            -p 3389:3389 \
            kalilinux/kali-rolling \
            tail -f /dev/null

      - name: 3. Install Desktop & XRDP in Container
        run: |
          # نصب محیط دسکتاپ و XRDP داخل کانتینر
          docker exec kali-rdp bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y kali-desktop-xfce xrdp sudo
            
            # ساخت کاربر admin
            useradd -m -s /bin/bash admin
            echo "admin:admin" | chpasswd
            usermod -aG sudo admin
            
            # تنظیم XFCE
            echo "xfce4-session" > /home/admin/.xsession
            chown admin:admin /home/admin/.xsession
            chmod +x /home/admin/.xsession
            sed -i "s/^exec.*/exec startxfce4/" /etc/xrdp/startwm.sh
            
            # شروع XRDP
            service xrdp start
          '
          
          echo ""
          echo "=================================================="
          echo "  >>> KALI LINUX RDP SERVER IS READY! <<<"
          echo "  Tailscale IP : ${{ env.TAILSCALE_IP }}"
          echo "  Username     : admin"
          echo "  Password     : admin"
          echo "  >> Connect to: ${{ env.TAILSCALE_IP }}"
          echo "=================================================="

      - name: 4. Keep Server Alive
        run: |
          for i in {1..360}; do
            echo "[$i/360] Kali server is running..."
            sleep 60
          done
