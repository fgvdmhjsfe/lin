name: Ubuntu Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # توجه: گیت‌هاب در پلن رایگان حداکثر ۶ ساعت (۳۶۰ دقیقه) اجازه اجرای مداوم می‌دهد

    steps:
      - name: 1. Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          
          # تنظیم محیط دسکتاپ XFCE به عنوان پیش‌فرض برای XRDP
          echo "xfce4-session" | tee ~/.xsession
          sudo cp ~/.xsession /etc/skel/.xsession
          sudo sed -i 's/^exec.*/exec startxfce4/' /etc/xrdp/startwm.sh || true
          sudo systemctl restart xrdp

      - name: 2. Create Admin Account
        run: |
          # ساخت کاربر NvDAdmin و تنظیم رمز عبور
          sudo useradd -m -s /bin/bash NvDAdmin
          echo "NvDAdmin:P@ssw0rd1qazXSW@#" | sudo chpasswd
          sudo usermod -aG sudo NvDAdmin
          
          # تنظیم رمز عبور برای کاربر پیش‌فرض runner (جهت اطمینان)
          echo "runner:P@ssw0rd1qazXSW@#" | sudo chpasswd

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # دانلود و نصب Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # اتصال به شبکه Tailscale
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-rdp-ubuntu"
          
          sleep 5
          
          # دریافت آی‌پی Tailscale
          TS_IP=$(sudo tailscale ip -4)
          
          echo ""
          echo "=================================================="
          echo "  >>> RDP SERVER IS READY! <<<"
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : NvDAdmin"
          echo "  Password     : P@ssw0rd1qazXSW@#"
          echo "  >> Open mstsc (or Remmina) and connect to: $TS_IP"
          echo "=================================================="

      - name: 4. Keep Server Alive (Max 6 Hours)
        run: |
          for i in {1..360}; do
            echo "[$i/360] Server running... (1 minute passed)"
            sleep 60
          done
